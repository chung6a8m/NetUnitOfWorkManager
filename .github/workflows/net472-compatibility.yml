name: .NET Framework 4.7.2 compatibility

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  net472-runtime:
    name: net472 runtime compatibility
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Verify .NET Framework 4.7.2 compatibility
        shell: pwsh
        run: ./scripts/verify-net472.ps1
